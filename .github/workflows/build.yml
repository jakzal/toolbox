name: Build

on:
    push:
        branches: [master]
    pull_request:
    release:
        types: [created]
    schedule:
        -   cron: '0 4 * * *'

env:
    GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    # for phive
    GITHUB_AUTH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
    tests:
        runs-on: ubuntu-latest
        name: Build and test
        strategy:
            matrix:
                php: [8.3, 8.4, 8.5]
                deps: [high]
                include:
                    -   php: 8.3
                        deps: low

        steps:
            -   uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    tools: composer
                    ini-values: "phar.readonly=0"
                    coverage: pcov

            -   if: matrix.deps == 'high'
                run: make update test package package-devkit

            -   if: matrix.deps == 'low'
                run: make update-min test-min

            -   uses: actions/upload-artifact@v6
                if: matrix.php == '8.3' && matrix.deps == 'high'
                with:
                    name: toolbox.phar
                    path: build/toolbox.phar

            -   uses: actions/upload-artifact@v6
                if: matrix.php == '8.3' && matrix.deps == 'high'
                with:
                    name: devkit.phar
                    path: build/devkit.phar

    diagnose:
        runs-on: ubuntu-latest
        name: Diagnose
        needs: [tests, integration-tests]
        if: >-
            failure()
            && (needs.tests.result == 'failure' || needs.integration-tests.result == 'failure')
            && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
            && github.repository_owner == 'jakzal'
        permissions:
            id-token: write
        env:
            OPENCODE_VERSION: "2.2.5"
            OPENCODE_MODEL: opencode/glm-5.3-flash-free
        steps:
            -   uses: actions/checkout@v5

            -   name: Fetch logs of failed steps
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    deadline=$(( $(date +%s) + 300 ))
                    until gh run view ${{ github.run_id }} --log-failed > failed-debug.log 2>/dev/null && [ -s failed-debug.log ]; do
                        if [ "$(date +%s)" -ge "$deadline" ]; then
                            echo "::warning::Build logs never became available for diagnosis within 5 minutes."
                            exit 1
                        fi
                        echo "Logs not yet available (archiving takes a moment) — retrying in 30 seconds..."
                        sleep 30
                    done

            -   name: Install opencode
                run: curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"

            -   name: Sign in to OpenCode
                env:
                    AUDIENCE: https://opencode.ai/console
                run: |
                    oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                        "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
                    token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
                        -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
                        -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
                        -d client_id=sk_9765447d-5143-4acf-a8bd-def4056263da \
                        -d subject_token="$oidc" | jq -r .access_token)
                    echo "::add-mask::$token"
                    echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

            -   name: Diagnose with opencode
                if: env.OPENCODE_API_KEY != ''
                id: diagnose
                run: |
                    opencode run --auto -m "$OPENCODE_MODEL" \
                        --file failed-debug.log \
                        "$(cat .github/diagnose-prompt.md)" | tee diagnosis.md

            -   name: Annotate Build
                if: steps.diagnose.outcome == 'success' && hashFiles('diagnosis.md') != ''
                run: cat diagnosis.md >> "$GITHUB_STEP_SUMMARY"

    integration-tests:
        runs-on: ubuntu-latest
        name: Run integration tests
        needs: tests
        strategy:
            matrix:
                php: [8.3, 8.4, 8.5]

        steps:
            -   uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    tools: composer
                    ini-values: "phar.readonly=0"
                    coverage: none
                    extensions: bz2, zip

            -   uses: actions/download-artifact@v7
                with:
                    name: toolbox.phar
                    path: build/
            -   run: make test-integration
                env:
                    GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-phars:
        runs-on: ubuntu-latest
        name: Publish PHARs
        needs: tests
        if: github.event_name == 'release'
        steps:
            -   uses: actions/download-artifact@v7
                with:
                    name: toolbox.phar
                    path: .
            -   uses: actions/download-artifact@v7
                with:
                    name: devkit.phar
                    path: .
            -   name: Upload toolbox.phar
                run: gh release upload ${{ github.event.release.tag_name }} toolbox.phar --clobber --repo github.com/jakzal/toolbox
                env:
                    GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
            -   name: Upload devkit.phar
                run: gh release upload ${{ github.event.release.tag_name }} devkit.phar --clobber --repo github.com/jakzal/toolbox
                env:
                    GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

